name: Build AioStream Universal APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: aiostream-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-universal-apk:
    name: Test & Build Universal APK (ARMv7a + ARM64v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reuse verified APK from matching commit build
        id: reuse_apk
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          existing_run_id="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.id != '"${{ github.run_id }}"' and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch") and .path == ".github/workflows/build-apk.yml")] | .[0].id // ""')"
          if [[ -n "${existing_run_id}" ]]; then
            echo "Reusing passing build run ${existing_run_id} for commit ${{ github.sha }}..."
            if gh run download "${existing_run_id}" --name AioStream-universal-release --dir dist; then
              downloaded_apk="$(find dist -maxdepth 3 -name '*.apk' | head -n 1)"
              if [[ -n "${downloaded_apk}" && -f "${downloaded_apk}" ]]; then
                if [[ "${downloaded_apk}" != "dist/AioStream-universal-release.apk" ]]; then
                  mv "${downloaded_apk}" dist/AioStream-universal-release.apk
                fi
                python3 scripts/verify_native_apk.py dist/AioStream-universal-release.apk --universal
                ls -lh dist/AioStream-universal-release.apk
                echo "reused=true" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
            fi
          fi
          rm -rf dist/*
          echo "reused=false" >> "${GITHUB_OUTPUT}"

      - name: Set up JDK 17
        if: steps.reuse_apk.outputs.reused != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.reuse_apk.outputs.reused != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK 29.0.14206865 & SDK 36
        if: steps.reuse_apk.outputs.reused != 'true'
        run: |
          SDK_MANAGER="$(command -v sdkmanager || find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)"
          yes | "${SDK_MANAGER}" --licenses >/dev/null || true
          "${SDK_MANAGER}" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Prepare build properties and signing config
        if: steps.reuse_apk.outputs.reused != 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.AIOSTREAM_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.AIOSTREAM_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.AIOSTREAM_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.AIOSTREAM_STORE_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: |
          touch local.properties local.dev.properties
          chmod +x gradlew

          if [[ -n "${RELEASE_KEYSTORE_BASE64}" ]]; then
            keystore_path="${RUNNER_TEMP}/aiostream-release.jks"
            printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
            {
              echo "NUVIO_RELEASE_STORE_FILE=${keystore_path}"
              echo "NUVIO_RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
              echo "NUVIO_RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
              echo "NUVIO_RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}"
            } >> "${GITHUB_ENV}"
          else
            ci_keystore="${RUNNER_TEMP}/aiostream-ci.jks"
            keytool -genkeypair \
              -v \
              -keystore "${ci_keystore}" \
              -storepass aiostream \
              -alias aiostream \
              -keypass aiostream \
              -dname "CN=AioStream,O=AioStream,C=VN" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            {
              echo "NUVIO_RELEASE_STORE_FILE=${ci_keystore}"
              echo "NUVIO_RELEASE_KEY_ALIAS=aiostream"
              echo "NUVIO_RELEASE_KEY_PASSWORD=aiostream"
              echo "NUVIO_RELEASE_STORE_PASSWORD=aiostream"
            } >> "${GITHUB_ENV}"
          fi

      - name: Run AioStream core & modified unit test suites
        if: steps.reuse_apk.outputs.reused != 'true'
        timeout-minutes: 20
        run: |
          ./gradlew :app:testFullDebugUnitTest \
            --tests 'com.nuvio.tv.data.repository.MDBListRepositoryTest' \
            --tests 'com.nuvio.tv.data.local.*' \
            --tests 'com.nuvio.tv.domain.model.*' \
            --tests 'com.nuvio.tv.launcher.*' \
            --tests 'com.nuvio.tv.ui.screens.settings.*' \
            --tests 'com.nuvio.tv.ui.screens.player.MobilePlayerAspectPolicyTest' \
            --tests 'com.nuvio.tv.ui.screens.player.TunneledSurfaceResizeModeTest' \
            --tests 'com.nuvio.tv.ui.screens.player.PlaybackPositionRowTest' \
            --tests 'com.nuvio.tv.ui.screens.player.PlayerControlDeckGeometryTest' \
            --tests 'com.nuvio.tv.core.sync.ProfileSettingsCredentialPolicyTest' \
            --tests 'com.nuvio.tv.core.sync.ProfileSettingsSubtitleLanguageSyncTest' \
            --tests 'com.nuvio.tv.core.backup.BackupCatalogTest' \
            --tests 'com.nuvio.tv.ui.v2.*' \
            --tests 'com.nuvio.tv.ui.monolith.*' \
            --tests 'com.nuvio.tv.ui.brand.*' \
            --tests 'com.nuvio.tv.core.auth.ContinueWithoutAccountTest' \
            --tests 'com.nuvio.tv.core.util.ProcessLocaleTest' \
            --tests 'com.nuvio.tv.core.assessment.*' \
            --tests 'com.nuvio.tv.updater.*' \
            --tests 'com.nuvio.tv.AppRootRoutesTest' \
            --tests 'com.nuvio.tv.core.tts.*' \
            --stacktrace

      - name: Build Universal Release APK (armeabi-v7a + arm64-v8a)
        if: steps.reuse_apk.outputs.reused != 'true'
        timeout-minutes: 45
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: ./gradlew :app:assembleFullRelease --stacktrace

      - name: Verify Universal APK native libraries & rename output
        if: steps.reuse_apk.outputs.reused != 'true'
        run: |
          mkdir -p dist
          apk_path="$(find app/build/outputs/apk/full/release -maxdepth 2 -name '*.apk' | head -n 1)"
          if [[ -z "${apk_path}" || ! -f "${apk_path}" ]]; then
            echo "Universal Release APK was not generated!" >&2
            find app/build/outputs -maxdepth 4 >&2 || true
            exit 1
          fi
          cp "${apk_path}" dist/AioStream-universal-release.apk
          python3 scripts/verify_native_apk.py dist/AioStream-universal-release.apk --universal
          ls -lh dist/AioStream-universal-release.apk

      - name: Upload Universal APK artifact
        if: steps.reuse_apk.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AioStream-universal-release
          path: dist/AioStream-universal-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AioStream-universal-release.apk
          generate_release_notes: true
